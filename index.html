<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev/in/Dev</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="icon" type="image/png" sizes="192x192" href="icon_192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon_512.png">
  <link rel="apple-touch-icon" href="icon_512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #111;
      font-family: system-ui, -apple-system, sans-serif;
    }

    header {
      padding: 10px;
      background: #222;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    select {
      background: #111;
      color: #eee;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      max-width: 320px;
      outline: none;
    }

    select:focus {
      border-color: #6366f1;
    }

    #tool-frame {
      width: 100%;
      flex: 1;
      border: none;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW Registered:', reg.scope))
          .catch(err => console.error('SW Failed:', err));
      });
    }
  </script>
</head>
<body>

<header>
  <select id="tool-select">
    <option value="" selected>-- Select Developer Tool --</option>
    
    <optgroup label="Core Utilities">
      <option value="DBedit.html">DB Manager</option>
      <option value="compiler.html">CDN Compiler</option>
      <option value="devref.html">Dev Reference</option>
    </optgroup>
    
    <optgroup label="Builders & Assets">
      <option value="icons2.html">Icon Studio</option>
      <option value="SWBuilder.html">SW Builder</option>
      <option value="SVG Studio.html">SVG Studio</option>
      <option value="opengraph.html">Opengraph Preview</option>
      <option value="TypeLab.html">TypeLab</option>
    </optgroup>
  </select>
</header>

<!-- Clean iframe with no initial src or srcdoc attributes -->
<iframe id="tool-frame"></iframe>

<!-- Template stored in DOM, ignored by browser until cloned/read -->
<template id="welcome-template">
  <!DOCTYPE html>
  <html>
    <head>
      <style>
        body {
          background: #111;
          color: #888;
          font-family: system-ui, -apple-system, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
          text-align: center;
        }
        h2 { color: #fff; margin-bottom: 8px; font-weight: 500; }
        p { margin: 0; font-size: 14px; }
      </style>
    </head>
    <body>
      <h2>Developer Toolkit Shell</h2>
      <p>Select a tool from the menu above to begin.</p>
    </body>
  </html>
</template>

<script>
  const toolSelect = document.getElementById('tool-select');
const toolFrame = document.getElementById('tool-frame');
const welcomeTemplate = document.getElementById('welcome-template');

function renderWelcomeView() {
  toolFrame.removeAttribute('src');
  toolFrame.srcdoc = welcomeTemplate.innerHTML;
}

// Initial landing page
renderWelcomeView();

if (toolSelect && toolFrame) {
  toolSelect.addEventListener('change', (e) => {
    const selectedFile = e.target.value;

    if (selectedFile) {
      // 1. Fully strip srcdoc to unlock the frame
      toolFrame.removeAttribute('srcdoc');
      
      // 2. Resolve relative path directly against current window/host location
      const hostPath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      toolFrame.src = hostPath + selectedFile;
    } else {
      renderWelcomeView();
    }
  });
}
</script>

</body>
</html>
